services:
  - type: web
    name: andrade-legal-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: MCP_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: NOTIFICATION_ENCRYPTION_KEY
        sync: false
      - key: EMAIL_DELIVERY_ENABLED
        value: "true"
